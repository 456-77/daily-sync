server:
  port: 8080

spring:
  application:
    name: daily-sync
  datasource:
    # 云服务器 120.26.58.22 上的 MySQL（Docker 容器，端口已对公网放开）；
    # 容器化部署时 DB_HOST 改为宿主机地址（host.docker.internal，见 docker-compose.yml）
    # allowPublicKeyRetrieval 是 MySQL 8 caching_sha2_password 首连必需
    url: jdbc:mysql://${DB_HOST:120.26.58.22}:${DB_PORT:3306}/daily_sync?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: daily_sync
    password: ${DB_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期把 SQL 打到控制台，方便学习观察；上生产前删掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

daily-sync:
  # JWT 签名密钥：必须 >= 32 字节。生产环境用环境变量覆盖，不要用默认值
  jwt-secret: ${JWT_SECRET:dev-only-secret-please-change-me-0123456789abcdef}
  jwt-access-ttl-minutes: 120
  # 注册邀请码：留空 = 开放注册；配置后注册必须携带
  invite-code: ${INVITE_CODE:}
  # 限流（M5）：/api/v1/auth/** 、/api/v1/sync 与附件上传下载均按客户端 IP。
  # 登录 10/分钟防密码爆破（插件登录也走此桶，多设备同 IP 足够）；
  # 同步 120/分钟——M5.1 起走 JWT，无效令牌在 HMAC 校验层即被拒；
  # 附件 600/分钟——一项一个请求，新设备首同步几十张图会瞬间打满同步桶，
  # 从而把随后的正文推送挤成 429，所以单独分桶；本机联调可整体关闭
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-per-minute: 10
    sync-per-minute: 120
    attachment-per-minute: 600
  # 附件（M7）：字节落磁盘，数据库只存元数据，两边靠 sha256 关联
  # 存储根目录按 <vaultId>/<sha256 前两位>/<sha256> 分层。相对路径按工作目录解析：
  #   本地 IDEA 运行 → backend/data/attachments
  #   容器运行（WORKDIR /app）→ /app/data/attachments，对应宿主机 /opt/daily-sync/data（见 docker-compose.yml）
  # 刻意不放在 src/main/resources 下：那会把附件烤进 jar，且每次构建都打包一遍
  storage:
    dir: ${ATTACHMENT_DIR:./data/attachments}
  attachments:
    # 全类型同步（M8）：附件通道即通用文件通道，上限放宽到 50MB（大 PDF/录音/幻灯片）
    max-file-bytes: 52428800     # 单文件 50MB；客户端 quick-note 侧常量须与此一致
    quota-bytes: 1073741824      # 每仓库配额 1GB（软上限，超限 413 并提示；存大文件多可用 env 调）
  # 安装包分发（M9）：stable/ 与 beta/ 两个子目录，包由本地构建后 scp 上来。
  # 与附件同款相对路径解析：本地 → backend/data/downloads，
  # 容器运行（WORKDIR /app）→ /app/data/downloads，对应宿主机 /opt/daily-sync/data
  downloads:
    dir: ${DOWNLOADS_DIR:./data/downloads}
  # 是否部署在反向代理之后（M6 上云后置 true）：开启后客户端 IP 取 X-Forwarded-For 首段。
  # 直连公网时保持 false——该头可被伪造，盲信会绕过按 IP 的限流
  behind-proxy: ${BEHIND_PROXY:false}
