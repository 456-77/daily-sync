server:
  port: 8080

spring:
  application:
    name: daily-sync
  datasource:
    # 云服务器 120.26.58.22 上的 MySQL（Docker 容器，端口已对公网放开）；
    # allowPublicKeyRetrieval 是 MySQL 8 caching_sha2_password 首连必需
    url: jdbc:mysql://120.26.58.22:3306/daily_sync?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: daily_sync
    password: ${DB_PASSWORD:DailySync_2026}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期把 SQL 打到控制台，方便学习观察；上生产前删掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

daily-sync:
  # JWT 签名密钥：必须 >= 32 字节。生产环境用环境变量覆盖，不要用默认值
  jwt-secret: ${JWT_SECRET:dev-only-secret-please-change-me-0123456789abcdef}
  jwt-access-ttl-minutes: 120
  # 注册邀请码：留空 = 开放注册；配置后注册必须携带
  invite-code: ${INVITE_CODE:}
  # 限流（M5）：/api/v1/auth/** 与 /api/v1/sync 均按客户端 IP。
  # 登录 10/分钟防密码爆破（插件登录也走此桶，多设备同 IP 足够）；
  # 同步 120/分钟——M5.1 起走 JWT，无效令牌在 HMAC 校验层即被拒；本机联调可整体关闭
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-per-minute: 10
    sync-per-minute: 120
  # 是否部署在反向代理之后（M6 上云后置 true）：开启后客户端 IP 取 X-Forwarded-For 首段。
  # 直连公网时保持 false——该头可被伪造，盲信会绕过按 IP 的限流
  behind-proxy: ${BEHIND_PROXY:false}
