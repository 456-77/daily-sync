# 8080 站点边缘反代（由 daily-sync compose 的 nginx 服务挂载为 default.conf）
# / → daily-sync 主站（门户/SPA/API/下载，M11 起含 OmoFun 存档页 /omofun/）
#
# M11 变更：OmoFun 存档从独立 Rust 服务（宿主 8082）并入 daily-sync 的 Spring Boot，
# 这里不再有 /omofun/ 的单独 location——所有请求原样转发给 daily-sync，
# /omofun/ 的 index 转发在 WebMvcConfig 里。
# 注意：client_max_body_size 必须覆盖 daily-sync 单附件上限 50MB
server {
    listen 8080;
    client_max_body_size 64m;
    proxy_http_version 1.1;

    location / {
        proxy_pass http://daily-sync:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
