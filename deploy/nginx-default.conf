# 8080 站点边缘反代（由 daily-sync compose 的 nginx 服务挂载为 default.conf）
# / → daily-sync 主站（门户/SPA/API/下载，M11 起含 OmoFun 存档页 /omofun/）
#
# M11 变更：OmoFun 存档从独立 Rust 服务（宿主 8082）并入 daily-sync 的 Spring Boot，
# 这里不再有 /omofun/ 的单独 location——所有请求原样转发给 daily-sync，
# /omofun/ 的 index 转发在 WebMvcConfig 里。
# 注意：client_max_body_size 必须覆盖 daily-sync 单附件上限 50MB
server {
    listen 8080;
    client_max_body_size 64m;
    proxy_http_version 1.1;

    location / {
        proxy_pass http://daily-sync:8080;
        # Host 必须带端口透传（2026-11-12 事故）：$host 是不含端口的裸主机名，
        # 客户端连 120.26.58.22:8080 时转发成 Host: 120.26.58.22，Tomcat 从无端口
        # 的 Host 头按 HTTP 默认端口解析出 80，tauri-manifest 的下载直链因此拼成
        # http://120.26.58.22/api/...（缺 :8080，桌面应用内更新 404）。
        # $http_host 是客户端原始 Host 头（自带端口），换域名/换端口也不用回来改这里。
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
