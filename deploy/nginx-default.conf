# 8080 站点边缘反代（由 daily-sync compose 的 nginx 服务挂载为 default.conf）
# / → daily-sync 主站（门户/SPA/API/下载）
# /omofun/ → OmoFun 历史存档（宿主机 systemd 服务 omofun-archiver，8082）
# 注意：client_max_body_size 必须覆盖 daily-sync 单附件上限 50MB
server {
    listen 8080;
    client_max_body_size 64m;
    proxy_http_version 1.1;

    location = /omofun { return 301 /omofun/; }
    location /omofun/ {
        proxy_pass http://host.docker.internal:8082/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://daily-sync:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
